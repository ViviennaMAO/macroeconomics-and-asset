name: FRED Data Sync

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 02:00 UTC (北京时间 10:00)
  workflow_dispatch:        # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node superbox-app/scripts/fetch-data.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain superbox-app/public/data/fred-latest.json)" ]; then
            echo "No data changes, skipping commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add superbox-app/public/data/fred-latest.json
          git commit -m "data: sync FRED $(date -u +%Y-%m-%d)"
          git push
